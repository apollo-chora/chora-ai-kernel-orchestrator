# oe_evaluator — per-sub-agent prompt config (ADR-172 §D2/§D4/§D5).
#
# AGENT-DRIVEN tiering (mirrors qgen agentconfig shape, CR qgen 2026-06-01):
# the evaluator is the grader of record — it scores ONE OE answer against a
# weighted rubric + model_answer AND, in assess_summary mode, drafts the
# holistic whole-assessment narrative. Both are quality-critical (a learner's
# grade rides on them) so it runs the HIGH text tier. The model is ENV-DRIVEN
# (the downstream oe-grading agent resolves it from its evaluator MODEL env var)
# and sent as the gateway logical_model_id plus the agent-declared fallback
# chain (InvokeRequest.fallback_logical_model_ids); the gateway HONOURS it. This
# YAML carries only the prompt version.
agent: oe_evaluator
sub_agents:
  evaluator:
    tier: high
    prompt_version: v1
