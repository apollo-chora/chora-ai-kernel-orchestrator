# qgen_question — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN model selection (CR qgen 2026-06-01): this YAML is the single
# source of truth for each sub-agent's model. The agent sends primary_model as
# the gateway's logical_model_id and fallback_models as the agent-declared
# fallback chain (InvokeRequest.fallback_logical_model_ids); the gateway
# HONOURS it.
#
# Single text model (longcat migration): the old HIGH/CHEAP tiering collapses
# to ONE route — every sub-agent sends longcat-2.5-preview as primary AND as
# its only fallback.
#   HIGH  = generation + evaluation → longcat-2.5-preview
#   CHEAP = assurance              → longcat-2.5-preview
#
# prompt_version selects the composer template version (resolved against the
# GCS prompt registry, falling back to embedded v1).
agent: qgen_question
sub_agents:
  assurance:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  generation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  evaluation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  # qgen_generate mode=compose (ADR-254 D2/D6): the testset composer ported
  # from the kennel (orchestrators/testset_composer.py). It reads exam-paper
  # PDFs/images by reference to extract marks cues, so it runs the multimodal
  # composer route the kennel used (QGEN_COMPOSER_MODEL_ID default), with
  # longcat-2.5-preview as primary and fallback.
  compose:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
