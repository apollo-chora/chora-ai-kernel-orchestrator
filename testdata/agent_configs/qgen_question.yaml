# qgen_question — per-sub-agent prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): the model tier is ENV-DRIVEN, not
# pinned here. The downstream qgen agent resolves each sub-agent's model from
# its QGEN_*_MODEL env vars (QUESTION_GENERATION / QUESTION_COMPOSE / CRITIC /
# RENDERER) and sends them as the gateway logical_model_id plus the
# agent-declared fallback chain (InvokeRequest.fallback_logical_model_ids); the
# gateway HONOURS it. This YAML carries only the per-sub-agent prompt template
# version (resolved against the GCS prompt registry, falling back to embedded v1).
#
# Tiers (locked 2026-06-01):
#   HIGH  = generation + evaluation (high text tier)
#   CHEAP = assurance              (cheap text tier)
#
# prompt_version selects the composer template version (resolved against the
# GCS prompt registry, falling back to embedded v1).
agent: qgen_question
sub_agents:
  assurance:
    tier: cheap
    prompt_version: v1
  generation:
    tier: high
    prompt_version: v1
  evaluation:
    tier: high
    prompt_version: v1
  # qgen_generate mode=compose (ADR-254 D2/D6): the testset composer ported
  # from the kennel (orchestrators/testset_composer.py). It reads exam-paper
  # PDFs/images by reference to extract marks cues, so it runs the pro
  # multimodal tier (the QGEN_COMPOSER_MODEL_ID env var), flash as the fallback.
  compose:
    tier: high
    prompt_version: v1
