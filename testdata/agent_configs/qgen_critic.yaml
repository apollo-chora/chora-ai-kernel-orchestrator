# qgen_critic — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): the critic is the CHEAP text tier
# (a fast accept/reject + revision-notes judge over a single candidate). It
# sends primary_model as the gateway logical_model_id + fallback_models as the
# agent-declared fallback chain.
#
#   CHEAP = critic → gemini-3.5-flash → gemini-2.5-flash
agent: qgen_critic
sub_agents:
  critic:
    tier: cheap
    primary_model: gemini-3.5-flash
    fallback_models: [gemini-2.5-flash]
    prompt_version: v1
