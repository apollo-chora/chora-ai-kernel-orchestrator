# qgen_critic — per-sub-agent prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): the critic is the CHEAP text tier
# (a fast accept/reject + revision-notes judge over a single candidate). The
# model is ENV-DRIVEN (the downstream qgen agent resolves it from the
# QGEN_CRITIC_MODEL env var) and sent as the gateway logical_model_id plus the
# agent-declared fallback chain. This YAML carries only the prompt version.
agent: qgen_critic
sub_agents:
  critic:
    tier: cheap
    prompt_version: v1
