[project]
name = "chora-ai-kernel-orchestrator"
version = "0.1.0"
description = "Chora AI Kernel — Python LangGraph orchestrator (hybrid kernel per Tier 2 D5)"
requires-python = ">=3.13"
authors = [
    { name = "Chora Platform Team (Team 3)" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.28",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "uuid7>=0.1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    # NATS JetStream — the local, cloud-neutral message bus that replaces
    # Google Cloud Pub/Sub. The kennel runtime + every dispatch lane publish
    # and consume through it (adapter/pubsub/nats.py).
    "nats-py>=2.6.0",
    # MinIO — the local, cloud-neutral object store that replaces Google
    # Cloud Storage for the qgen render_image upload + weakness download
    # paths (adapter/gcs/*). The gs:// URI scheme is retained as the canonical
    # object reference; the adapter translates it to MinIO bucket/key.
    "minio>=7.2.0",
    # PyYAML — required by ModelArmorGuardrailPort to load the
    # agent → tier mapping at composition root (config/agent-guardrail-mapping.yaml).
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.32",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "coverage>=7.6",
]

[project.scripts]
chora-ai-kernel-orchestrator = "chora_ai_kernel_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chora_ai_kernel_orchestrator"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20", "ASYNC"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() in defaults is idiomatic; E501: long strings/URLs/comments (matches the chora-model-gateway convention)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
# Type-check the package only. The test suite drives the graphs with in-process
# fakes that intentionally do not match the runtime protocols (a LangGraph
# state dict vs the typed state, a fake saver, ...); type-checking those fakes
# is noise, so mypy is scoped to src.
files = ["src/chora_ai_kernel_orchestrator"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "uuid7",
    "grpc.*",
    "minio.*",
    "nats.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "unit: fast in-process unit tests",
    "integration: requires guardrail / model broker stubs",
]

[tool.coverage.run]
source = ["src/chora_ai_kernel_orchestrator"]
branch = true
omit = [
    "src/chora_ai_kernel_orchestrator/main.py",
    "src/chora_ai_kernel_orchestrator/observability/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
